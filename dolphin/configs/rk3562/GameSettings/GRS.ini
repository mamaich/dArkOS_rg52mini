# dArkOS RG52 Mini: Soulcalibur II (and its demo). In dual core the emulated GPU desyncs from
# the emulated CPU ("GFX FIFO: Unknown Opcode") and the game hangs within a minute or two;
# synchronizing the GPU thread keeps it running (2026-11-22, the USA demo: 3 of 3 runs hung
# without, 3 of 3 ran with).
[Core]
SyncGPU = True
