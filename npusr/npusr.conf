# dArkOS RG52 Mini: NPU UPSCALE (darkos-npusr, docs/KNOWN-ISSUES.md).
# EmulationStation offers NPU UPSCALE in EMULATOR SETTINGS for these systems (its own names,
# aliases included); their launchers know what to do with it: retroarch for Azahar (3DS),
# ppsspp.sh for PPSSPP standalone (PSP), and retroarch32, retroarch and retroarch-next for the
# cores darkos-npusr's GLES_CORES names (libnpusr_gles.so): PS1, and since 2026-11-24 (the owner)
# Mega Drive, Sega CD and 32X, SNES, NES, PC Engine and Neo Geo - the systems whose frames the
# models fit (256, 320 or 368 wide by 224 or 240). With another core of such a system the game
# starts as without the upscale. One line: ES reads the value up to the line's end.
es_systems = 3ds, n3ds, ppsspp, pspminis, psx, megadrive, megadrivejp, genesis, segacd, megacd, megacdjp, sega32x, sega32xjp, sega32xna, snes, sfc, snesna, snes-hacks, nes, famicom, famicom disk system, pcengine, pcenginecd, turbografx16, tg16, turbografxcd, tg-cd, supergrafx, neogeo, neogeocd, neogeocdjp
